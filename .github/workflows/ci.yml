name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-fmt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The tests talk to relays over real sockets, so a regression that brings
    # back an unbounded wait shows up as a hang. It should fail the job in
    # minutes, not hold a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the installer check below can ask for a real release
          # rather than the GitHub API, which rate-limits shared runners.
          fetch-depth: 0

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Check formatting
        run: zig fmt --check .

      # The installer is served over `curl | bash`, and macOS ships bash 3.2,
      # where a multibyte character sitting next to a $variable under `set -u`
      # aborts the script. The Windows one is read by Windows PowerShell 5.1,
      # which takes a file without a byte order mark to be in the machine's
      # legacy code page. An installer that dies on its own punctuation is a
      # bad first impression, so the scripts are pure ASCII and this is what
      # keeps them that way. `tr` rather than a grep class, because BSD grep has
      # no -P and the character classes differ between the two greps.
      - name: The scripts are pure ASCII
        run: |
          set -euo pipefail
          status=0
          for f in scripts/*.sh scripts/*.ps1 examples/*/*.sh; do
            n="$(tr -d '\000-\177' < "$f" | wc -c | tr -d ' ')"
            if [ "$n" != "0" ]; then
              echo "$f carries $n bytes outside ASCII" >&2
              status=1
            fi
          done
          [ "$status" = "0" ] || exit 1
          echo "the scripts are ASCII"

      - name: The installer parses
        run: bash -n scripts/install.sh

      - name: The examples parse
        run: for f in examples/*/*.sh; do bash -n "$f"; done

      # End to end against a real published release: resolve the artifact, fetch
      # it and the digest beside it, verify, install, and run what was installed.
      # Asking only whether the script parses would pass on an installer that
      # downloads the wrong file or verifies nothing.
      - name: The installer installs a release, and it runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The newest PUBLISHED release, not the newest tag: a tag whose
          # release is still a draft has nothing a reader could download.
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then
            echo "no release tag exists yet, so the installer was NOT exercised" >&2
            exit 1
          fi
          bash scripts/install.sh --version "$tag" --prefix "$RUNNER_TEMP/deed"
          bin="$RUNNER_TEMP/deed/bin/deed"
          [ -x "$bin" ] || { echo "the installer reported success and installed nothing" >&2; exit 1; }
          got="$("$bin" version)"
          [ "$got" = "deed ${tag#v}" ] || { echo "installed binary says '$got', expected 'deed ${tag#v}'" >&2; exit 1; }
          sk="$("$bin" key generate --hex)"
          "$bin" event -c "installer check" --sec "$sk" | "$bin" verify
          echo "installed $got and it works"

      # The guard above has to be able to fail. A tampered archive must be
      # refused and must install nothing, because a checksum that is checked and
      # then ignored is worse than none: it reads as a promise.
      - name: A download that does not verify is refused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          [ -n "$tag" ] || { echo "no published release to tamper with" >&2; exit 1; }
          work="$RUNNER_TEMP/tamper"
          mkdir -p "$work"
          case "$(uname -s)" in
            Darwin) plat="macos" ;;
            *) plat="linux" ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) cpu="x86_64" ;;
            *) cpu="aarch64" ;;
          esac
          asset="deed-${tag#v}-$plat-$cpu.tar.gz"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"
          curl -fsSL -o "$work/$asset" "$base/$asset"
          curl -fsSL -o "$work/$asset.sha256" "$base/$asset.sha256"
          printf 'x' >> "$work/$asset"
          if bash scripts/install.sh --archive "$work/$asset" --prefix "$work/out"; then
            echo "the installer accepted a tampered archive" >&2
            exit 1
          fi
          [ ! -e "$work/out/bin/deed" ] || { echo "it refused and installed anyway" >&2; exit 1; }
          echo "a tampered archive is refused and nothing is installed"

  # Windows gets its own job because most of the steps above are bash scripts
  # for the macOS and Linux installer. What matters here is that deed builds,
  # that its tests (which talk to relays over real loopback sockets) pass, and
  # that the binary that was built runs. Formatting does not depend on the
  # platform and is checked above.
  build-test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      # A binary that links is not a binary that runs. This makes a key, signs
      # an event with it and checks the signature, through a pipe, which covers
      # the argument parsing, the environment, and standard input and output
      # that differ most on Windows.
      - name: The binary runs
        run: |
          set -euo pipefail
          bin=zig-out/bin/deed.exe
          [ -f "$bin" ] || { echo "the build produced no deed.exe" >&2; exit 1; }
          got="$("$bin" version)"
          want="deed $(sed -n 's/^pub const version = "\(.*\)";$/\1/p' src/main.zig)"
          [ "$got" = "$want" ] || { echo "the binary says '$got', expected '$want'" >&2; exit 1; }
          sk="$("$bin" key generate --hex)"
          NOSTR_SECRET_KEY="$sk" "$bin" event -c "windows check" | "$bin" verify
          echo "deed runs on Windows"

  # The Windows installer, end to end against the newest published release,
  # under both PowerShells: pwsh, and Windows PowerShell 5.1, which is the one
  # every Windows machine has and the one whose syntax the script keeps to.
  install-windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # The newest PUBLISHED release, not the newest tag, as the check for
      # install.sh asks: a tag whose release is still a draft has nothing a
      # reader could download.
      - name: Find the newest published release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then
            echo "no release tag exists yet, so the installer was NOT exercised" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: The installer parses
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "install.ps1 parses under PowerShell $($PSVersionTable.PSVersion)"

      # The way the README runs it: the script's text handed to
      # Invoke-Expression, which is all `irm | iex` does, with the options in
      # the environment because a piped run has no command line. The text comes
      # from this checkout rather than from main, so it is the change under
      # test that runs.
      - name: The piped installer installs a release, and it runs
        env:
          DEED_VERSION: ${{ steps.release.outputs.tag }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'deed-piped'
          $env:DEED_PREFIX = $prefix
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          $bin = Join-Path $prefix 'deed.exe'
          if (-not (Test-Path -LiteralPath $bin)) { Write-Host "the installer reported success and installed nothing"; exit 1 }
          $got = & $bin version
          $want = "deed $($env:TAG.Substring(1))"
          if ($got -ne $want) { Write-Host "installed binary says '$got', expected '$want'"; exit 1 }
          Write-Host "installed $got"

      # The same, run as a file with options on its command line. It runs twice,
      # because installing over an existing copy is how an upgrade happens, and
      # the second run must not add the folder to PATH a second time.
      - name: The installer run as a file installs a release, and PATH gets one entry
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'deed'
          foreach ($run in 1, 2) {
            & .\scripts\install.ps1 -Version $env:TAG -Prefix $prefix
            if ($LASTEXITCODE -ne 0) { Write-Host "run $run of the installer failed"; exit 1 }
          }
          $got = & (Join-Path $prefix 'deed.exe') version
          $want = "deed $($env:TAG.Substring(1))"
          if ($got -ne $want) { Write-Host "installed binary says '$got', expected '$want'"; exit 1 }
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          $entries = @($user -split ';' | Where-Object { $_.TrimEnd('\') -eq $prefix.TrimEnd('\') })
          if ($entries.Count -ne 1) { Write-Host "the user PATH carries $prefix $($entries.Count) times, expected once"; exit 1 }
          "bin=$(Join-Path $prefix 'deed.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "installed $got, on PATH once"

      # A real gesture rather than just `version`: libsecp256k1, the bech32
      # encoder and the JSON writer and reader in one line, as the check for
      # install.sh does. In bash, so the pipe between the two deeds carries
      # bytes and not the re-encoded text PowerShell would make of it.
      - name: The installed deed signs and verifies
        shell: bash
        run: |
          set -euo pipefail
          bin="$(cygpath -u "$bin")"
          sk="$("$bin" key generate --hex)"
          "$bin" event -c "installer check" --sec "$sk" | "$bin" verify
          echo "the installed deed works"

      # The guard above has to be able to fail. A tampered archive must be
      # refused and must install nothing, because a checksum that is checked and
      # then ignored is worse than none: it reads as a promise. The untampered
      # archive goes through first, so a refusal means the digest and not the
      # -Archive path.
      - name: A download that does not verify is refused
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'tamper'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $asset = "deed-$($env:TAG.Substring(1))-windows-x86_64.zip"
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
          $zip = Join-Path $work $asset
          Invoke-WebRequest -Uri "$base/$asset" -OutFile $zip -UseBasicParsing
          Invoke-WebRequest -Uri "$base/$asset.sha256" -OutFile "$zip.sha256" -UseBasicParsing

          & .\scripts\install.ps1 -Archive $zip -Prefix (Join-Path $work 'ok')
          if ($LASTEXITCODE -ne 0) { Write-Host "the installer refused the archive as published"; exit 1 }

          [IO.File]::AppendAllText($zip, 'x')
          $out = Join-Path $work 'out'
          & .\scripts\install.ps1 -Archive $zip -Prefix $out
          if ($LASTEXITCODE -eq 0) { Write-Host "the installer accepted a tampered archive"; exit 1 }
          if (Test-Path -LiteralPath (Join-Path $out 'deed.exe')) { Write-Host "it refused and installed anyway"; exit 1 }
          Write-Host "a tampered archive is refused and nothing is installed"
          exit 0
